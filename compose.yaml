x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: api
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://hackingbara:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres/hackingbara
    REDIS_URL: redis://redis:6379/0
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost}
    SECURE_COOKIES: ${SECURE_COOKIES:-true}
    SECRET_KEY_FILE: /run/secrets/credential_key
    MAX_TARGETS: ${MAX_TARGETS:-256}
    MAX_PORTS: ${MAX_PORTS:-10000}
    MAX_QUEUE: ${MAX_QUEUE:-32}
    MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
    EYEWITNESS_ENABLED: ${EYEWITNESS_ENABLED:-false}
  secrets: [credential_key]
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [control]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hackingbara
      POSTGRES_USER: hackingbara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U hackingbara -d hackingbara']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [control]
  redis:
    image: redis:7-alpine
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [control]
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    # Launch-time URL resolution needs external DNS; no API host port is published.
    networks: [control, edge]
    volumes: [evidence:/evidence:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
  worker:
    <<: *app
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    volumes: [evidence:/evidence]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    init: true
    networks: [control, scanner]
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2
    shm_size: 256m
    ulimits:
      nofile: {soft: 4096, hard: 4096}
  scheduler:
    <<: *app
    command: [python, -m, app.scheduler]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    mem_limit: 256m
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ['${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [control, edge]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 128m

volumes:
  postgres_data:
  evidence:
secrets:
  credential_key:
    file: ./secrets/credential_key
networks:
  control:
    internal: true
  scanner: {}
  edge: {}
