# Docker service addresses can change whenever an API container is recreated.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream hackingbara_api {
    zone hackingbara_api 64k;
    server api:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health {
        proxy_pass http://hackingbara_api/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
    location /api/ {
        proxy_pass http://hackingbara_api;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
