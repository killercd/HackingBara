[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hackingbara"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.6,<3",
  "celery[redis]>=5.4,<6", "argon2-cffi>=23,<26", "cryptography>=43,<47",
  "python-multipart>=0.0.20,<1", "defusedxml>=0.7,<1", "pillow>=11,<13"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[project.scripts]
hackingbara = "app.cli:main"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
